<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JalaLive Scraper</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            emerald: { 450: '#34d399' },
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <!-- Navbar -->
  <nav class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-8">
          <a href="/" class="flex items-center space-x-2" onclick="return navigate(event, '/')">
            <div class="w-8 h-8 bg-emerald-500 rounded-lg flex items-center justify-center">
              <i class="fas fa-futbol text-gray-900 text-sm"></i>
            </div>
            <span class="font-bold text-lg">JalaLive</span>
            <span class="text-xs text-gray-500 font-mono">Scraper</span>
          </a>
          <div class="hidden md:flex space-x-1">
            <a href="/" class="nav-link" data-route="/" onclick="return navigate(event, '/')">
              <i class="fas fa-chart-pie w-4"></i> Dashboard
            </a>
            <a href="/matches" class="nav-link" data-route="/matches" onclick="return navigate(event, '/matches')">
              <i class="fas fa-calendar-alt w-4"></i> Matches
            </a>
            <a href="/news" class="nav-link" data-route="/news" onclick="return navigate(event, '/news')">
              <i class="fas fa-newspaper w-4"></i> News
            </a>
            <a href="/domains" class="nav-link" data-route="/domains" onclick="return navigate(event, '/domains')">
              <i class="fas fa-server w-4"></i> Domains
            </a>
          </div>
        </div>
        <div class="flex items-center space-x-3">
          <span id="connection-status" class="flex items-center space-x-1 text-xs px-2 py-1 rounded-full bg-gray-800">
            <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>
            <span class="text-gray-400">Connected</span>
          </span>
          <button class="md:hidden p-2 text-gray-400 hover:text-white" onclick="toggleMobileMenu()">
            <i class="fas fa-bars"></i>
          </button>
        </div>
      </div>
      <!-- Mobile menu -->
      <div id="mobile-menu" class="hidden md:hidden pb-3 space-y-1">
        <a href="/" class="nav-link mobile-nav" data-route="/" onclick="return navigate(event, '/')">
          <i class="fas fa-chart-pie w-4"></i> Dashboard
        </a>
        <a href="/matches" class="nav-link mobile-nav" data-route="/matches" onclick="return navigate(event, '/matches')">
          <i class="fas fa-calendar-alt w-4"></i> Matches
        </a>
        <a href="/news" class="nav-link mobile-nav" data-route="/news" onclick="return navigate(event, '/news')">
          <i class="fas fa-newspaper w-4"></i> News
        </a>
        <a href="/domains" class="nav-link mobile-nav" data-route="/domains" onclick="return navigate(event, '/domains')">
          <i class="fas fa-server w-4"></i> Domains
        </a>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main id="app" class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex items-center justify-center py-20">
      <div class="text-center">
        <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-emerald-500 mx-auto mb-4"></div>
        <p class="text-gray-400">Loading...</p>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/matches.js"></script>
  <script src="js/match-detail.js"></script>
  <script src="js/news.js"></script>
  <script src="js/domains.js"></script>
</body>
</html>
