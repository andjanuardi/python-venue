<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AgresID Explorer{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-size: .9rem; }
        .product-img { width: 60px; height: 60px; object-fit: contain; }
        .product-img-lg { width: 100%; max-height: 400px; object-fit: contain; }
        .price-discount { color: var(--bs-danger); font-weight: 700; }
        .price-original { text-decoration: line-through; color: var(--bs-secondary); font-size: .85em; }
        .badge-stock { font-size: .75em; }
        .sidebar { position: sticky; top: 1rem; }
        .filter-section { margin-bottom: 1rem; }
        .nav-link { font-size: .9rem; }
        .table th { white-space: nowrap; }
        .text-truncate-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .progress-thin { height: 4px; }
        .stat-card { border-left: 3px solid var(--bs-primary); }
        .stat-card.warning { border-left-color: var(--bs-warning); }
        .stat-card.success { border-left-color: var(--bs-success); }
        .stat-card.info { border-left-color: var(--bs-info); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary mb-3">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-box-seam me-2"></i>AgresID Explorer
            </a>
            <div class="d-flex align-items-center gap-2">
                <span class="text-secondary small d-none d-md-inline" id="product-count"></span>
                <button class="btn btn-sm btn-outline-primary" id="btn-scrape" onclick="startScrape()">
                    <i class="bi bi-arrow-repeat me-1"></i>Scrape Now
                </button>
                <a href="/export{{ '?' + request_args|urlencode if request_args|length else '' }}" class="btn btn-sm btn-outline-success">
                    <i class="bi bi-download me-1"></i>CSV
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div id="scrape-progress" class="alert alert-info d-none mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <span id="scrape-status">Scraping...</span>
                <small id="scrape-count" class="text-muted">0 products</small>
            </div>
            <div class="progress progress-thin">
                <div id="scrape-bar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
            </div>
        </div>

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('product-count') && fetch('/stats')
            .then(r => r.json())
            .then(d => {
                document.getElementById('product-count').textContent =
                    d.total_products.toLocaleString() + ' products · ' +
                    d.in_stock.toLocaleString() + ' in stock · ' +
                    d.brands + ' brands · ' + d.categories + ' categories';
            });

        function startScrape() {
            const btn = document.getElementById('btn-scrape');
            const progress = document.getElementById('scrape-progress');
            const bar = document.getElementById('scrape-bar');
            const status = document.getElementById('scrape-status');
            const count = document.getElementById('scrape-count');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Scraping...';
            progress.classList.remove('d-none');

            fetch('/scrape', { method: 'POST' }).then(r => r.json()).then(d => {
                if (!d.success) {
                    status.textContent = 'Error: ' + d.error;
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-arrow-repeat me-1"></i>Scrape Now';
                    return;
                }
                const interval = setInterval(() => {
                    fetch('/scrape/status').then(r => r.json()).then(s => {
                        if (s.progress) {
                            const p = s.progress;
                            const total = p.total_available || 1;
                            const scraped = p.scraped || 0;
                            const pct = Math.min(100, Math.round(scraped / total * 100));
                            bar.style.width = pct + '%';
                            status.textContent = 'Scraping... ' + pct + '% (' + scraped + '/' + total + ' pages)';
                            count.textContent = p.created + ' new, ' + p.updated + ' updated';
                            if (p.errors > 0) count.textContent += ', ' + p.errors + ' errors';
                        }
                        if (s.done) {
                            clearInterval(interval);
                            bar.classList.remove('progress-bar-animated');
                            bar.style.width = '100%';
                            status.textContent = 'Done!';
                            setTimeout(() => {
                                progress.classList.add('d-none');
                                btn.disabled = false;
                                btn.innerHTML = '<i class="bi bi-arrow-repeat me-1"></i>Scrape Now';
                                location.reload();
                            }, 1500);
                        }
                    });
                }, 500);
            });
        }
    </script>
</body>
</html>
